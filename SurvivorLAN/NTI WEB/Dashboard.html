                  <div>
                    <div className="flex items-center space-x-3 pb-3 border-b border-apocalypse-800">
                      <div className="w-10 h-10 rounded bg-apocalypse-850 border border-apocalypse-700 flex items-center justify-center font-mono font-bold text-hazard-yellow text-sm">
                        {m.name.split(' ').map(n => n[0]).join('')}
                      </div>
                      <div>
                        <h3 className="text-sm font-bold text-white font-sans">{m.name}</h3>
                        <p className="text-[11px] text-hazard-yellow font-mono font-semibold">{m.role}</p>
                      </div>
                    </div>
                    
                    <div className="mt-3.5">
                      <span className="text-[10px] font-mono text-gray-400 uppercase tracking-wider block mb-1">Assigned Scope & Deliverables:</span>
                      <p className="text-xs text-gray-300 font-sans leading-relaxed bg-apocalypse-950 p-2.5 rounded border border-apocalypse-800 font-mono">
                        {m.details}
                      </p>
                    </div>
                  </div>

                  <div className="mt-4 pt-3 border-t border-apocalypse-800 flex justify-end">
                    <a
                      href={m.linkedin}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="px-3 py-1.5 rounded bg-amber-500/10 hover:bg-amber-500/20 text-hazard-yellow border border-hazard-yellow/30 text-xs font-mono transition-all flex items-center gap-1.5"
                    >
                      <span>LinkedIn Profile</span>
                      <span>→</span>
                    </a>
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* Footer */}
          <footer className="mt-12 border-t border-apocalypse-800 py-8 px-4 sm:px-8 text-center text-xs font-mono text-gray-500">
            <div>SURVIVORLAN — 192.168.0.0/24 CISCO SURVIVAL NETWORK DEMONSTRATION</div>
            <div className="mt-1">Front-End Architecture & Security Demonstration Platform</div>
          </footer>

          {/* Projector Presentation Modal */}
          {isPresentationOpen && (
            <div className="fixed inset-0 z-50 bg-apocalypse-950 flex flex-col justify-between p-6 sm:p-10 font-sans">
              <div className="flex justify-between items-center border-b border-apocalypse-800 pb-4 font-mono">
                <span className="px-3 py-1 rounded bg-hazard-yellow/20 text-hazard-yellow border border-hazard-yellow/40 text-sm font-bold">
                  TACTICAL BRIEFING {slides[presentationSlide].step} / 07
                </span>
                <button
                  onClick={() => setIsPresentationOpen(false)}
                  className="px-3 py-1 bg-apocalypse-850 hover:bg-apocalypse-800 rounded border border-apocalypse-700 text-xs text-white"
                >
                  ESC / CLOSE
                </button>
              </div>

              <div className="max-w-4xl mx-auto w-full my-auto space-y-6">
                <div>
                  <span className="text-hazard-orange font-mono text-sm uppercase font-bold">{slides[presentationSlide].subtitle}</span>
                  <h2 className="text-3xl sm:text-5xl font-extrabold font-mono text-white mt-1">{slides[presentationSlide].title}</h2>
                </div>

                <div className="p-6 sm:p-8 rounded-2xl bg-apocalypse-900 border border-apocalypse-750 shadow-2xl space-y-4">
                  <ul className="space-y-3">
                    {slides[presentationSlide].points.map((p, i) => (
                      <li key={i} className="text-base sm:text-lg text-gray-200 flex items-start space-x-2.5 leading-relaxed">
                        <span className="text-hazard-bio font-bold">✓</span>
                        <span>{p}</span>
                      </li>
                    ))}
                  </ul>

                  <div className="p-3.5 rounded bg-apocalypse-950 border border-hazard-yellow/30 font-mono text-xs sm:text-sm text-hazard-yellow flex justify-between">
                    <span className="text-gray-400">DATA PATHWAY:</span>
                    <span className="font-bold">{slides[presentationSlide].diagram}</span>
                  </div>
                </div>
              </div>

              <div className="flex justify-between items-center border-t border-apocalypse-800 pt-4 max-w-4xl mx-auto w-full font-mono text-xs">
                <button
                  onClick={() => setPresentationSlide(0)}
                  className="px-3 py-1.5 rounded bg-apocalypse-850 border border-apocalypse-700 text-gray-300"
                >
                  RESTART (01)
                </button>

                <div className="flex space-x-2">
                  <button
                    onClick={() => setPresentationSlide(prev => Math.max(prev - 1, 0))}
                    disabled={presentationSlide === 0}
                    className="px-4 py-1.5 rounded bg-apocalypse-850 border border-apocalypse-750 disabled:opacity-30"
                  >
                    PREV
                  </button>
                  <button
                    onClick={() => setPresentationSlide(prev => Math.min(prev + 1, slides.length - 1))}
                    disabled={presentationSlide === slides.length - 1}
                    className="px-4 py-1.5 rounded bg-hazard-yellow text-black font-bold disabled:opacity-30"
                  >
                    NEXT
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
